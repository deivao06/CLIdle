name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -short ./...

      - name: Windows resources
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --product-version "${GITHUB_REF_NAME#v}" --file-version "${GITHUB_REF_NAME#v}"

      - name: Build
        run: |
          ver="-X clidle/internal/update.Version=${GITHUB_REF_NAME}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w $ver" -o dist/clidle-linux-amd64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$ver" -o dist/clidle-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w $ver" -o dist/clidle-playground-linux-amd64 ./cmd/playground
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$ver" -o dist/clidle-playground-windows-amd64.exe ./cmd/playground
          cd dist && sha256sum clidle-* > SHA256SUMS

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${prev:+$prev..}${GITHUB_REF_NAME}"
          feat=$(git log --pretty=%s "$range" | sed -n 's/^feat[^:]*: */* /p')
          fix=$(git log --pretty=%s "$range" | sed -n 's/^fix[^:]*: */* /p')
          : > notes.md
          if [ -n "$feat" ]; then printf "## What's new\n\n%s\n\n" "$feat" >> notes.md; fi
          if [ -n "$fix" ]; then printf '## Fixes\n\n%s\n\n' "$fix" >> notes.md; fi
          if [ ! -s notes.md ]; then echo "No gameplay changes." > notes.md; fi
          if [ -n "$prev" ]; then echo "**Commits:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}" >> notes.md; fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # The GitHub API sometimes answers 500; retry, and finish a release a failed try left half made.
        run: |
          for wait in 15 30 60 120 0; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber && gh release edit "$GITHUB_REF_NAME" --notes-file notes.md && exit 0
            else
              gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md && exit 0
            fi
            [ "$wait" = 0 ] && exit 1
            echo "GitHub failed, trying again in ${wait}s"
            sleep "$wait"
          done
