<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLIdle · simulações</title>
<style>
  :root {
    --bg: #0e0f0f;
    --side: #131414;
    --surface: #171919;
    --raise: #1f2222;
    --line: #2b2f2f;
    --grid: #202323;
    --text: #e6e8e6;
    --muted: #9aa09c;
    --faint: #878d89;
    --accent: #ffaf00;
    --run: #87d787;
    --stale: #ff8a5f;
    --warrior: #ff5f5f;
    --mage: #5fafff;
    --rogue: #87d787;
    --cleric: #ffd700;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
  ::selection { background: var(--accent); color: #111; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100%; }
  aside { background: var(--side); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 14px; }
  aside h1 { margin: 0 8px; font-size: 15px; font-weight: 650; color: var(--accent); letter-spacing: .01em; }
  aside nav { display: flex; flex-direction: column; gap: 2px; }
  .item { all: unset; cursor: pointer; display: grid; gap: 2px; padding: 9px 10px; border-radius: 6px; color: var(--muted); }
  .item:hover { background: var(--raise); color: var(--text); }
  .item[aria-current="true"] { background: var(--raise); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .item .t { font-weight: 550; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .s { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  #conn { margin: auto 8px 0; font-size: 12px; color: var(--faint); }
  #conn.err { color: var(--stale); }

  main { padding: 24px 32px 48px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
  .vhead h2 { margin: 0 0 6px; font-size: 20px; font-weight: 650; line-height: 1.25; text-wrap: balance; }
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); font-size: 13px; }
  .status b { color: var(--text); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.run { background: var(--run); animation: pulse 1.6s ease-out infinite; }
  .dot.stale { background: var(--stale); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(135,215,135,.55); } 100% { box-shadow: 0 0 0 7px rgba(135,215,135,0); } }
  .state { font-weight: 600; }
  .state.run { color: var(--run); } .state.stale { color: var(--stale); } .state.done { color: var(--text); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .seg button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 5px; color: var(--muted); font-size: 13px; transition: background 150ms ease-out, color 150ms ease-out; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .seg-label { color: var(--faint); font-size: 12px; margin-right: 6px; }
  .check { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }

  .charts { display: grid; gap: 28px 20px; }
  .charts.split { grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); }
  .pane { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .pane h3 { margin: 0; font-size: 15px; font-weight: 650; }
  .chartbox { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 8px 8px; }
  canvas { display: block; width: 100%; height: clamp(240px, 42vh, 440px); cursor: crosshair; }
  .split canvas { height: clamp(220px, 36vh, 380px); }
  .tip { position: absolute; top: 14px; pointer-events: none; min-width: 170px; background: #0b0c0c; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.55); opacity: 0; transition: opacity 120ms ease-out; }
  .tip.on { opacity: 1; }
  .tip .h { color: var(--muted); margin-bottom: 4px; }
  .tip .r { display: flex; justify-content: space-between; gap: 14px; }
  .tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .tip .rng { color: var(--faint); margin-left: 6px; }
  .hint { margin: -6px 0 0; color: var(--faint); font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--faint); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  td .rng { color: var(--faint); font-size: 12px; margin-left: 4px; }
  tr.off td { color: var(--faint); }
  tr.off .sw { opacity: .3; }
  .cls { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; font-weight: 600; }
  .cls:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .tablewrap { overflow-x: auto; }

  .side-h { margin: 6px 10px 0; font-size: 12px; font-weight: 500; color: var(--faint); }
  .side-empty { margin: 0 10px; font-size: 12px; color: var(--faint); }
  td.pass { color: var(--run); } td.fail { color: var(--stale); }
  .codebtn { all: unset; cursor: pointer; padding: 2px 6px; margin: -2px -6px; border-radius: 4px; }
  .codebtn:hover { background: var(--raise); text-decoration: underline; text-underline-offset: 3px; }
  .codebtn:focus-visible { outline: 2px solid var(--accent); }
  td.runs .codebtn { margin: 0 0 0 2px; padding: 1px 7px; border: 1px solid var(--line); }
  td.runs .codebtn.live { color: var(--run); border-color: #3a5a3a; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 8px); max-width: min(720px, calc(100vw - 32px));
    background: #0b0c0c; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: var(--muted);
    box-shadow: 0 12px 32px rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity 160ms ease-out, transform 160ms ease-out; z-index: 5; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #toast b { color: var(--text); }
  #toast code { display: inline-block; margin: 6px 0; padding: 3px 8px; border-radius: 5px; background: var(--raise); color: var(--accent); font: 14px var(--mono); user-select: all; }
  .pane .sum { margin: -6px 0 0; color: var(--muted); font-size: 13px; }
  .pane .sum a, .profiles a { color: var(--accent); text-underline-offset: 3px; }
  .profiles { max-width: 1100px; display: flex; flex-direction: column; gap: 18px; }
  .profiles h2 { margin: 0; font-size: 20px; font-weight: 650; }
  .profiles > p { margin: 0; color: var(--muted); max-width: 72ch; }
  .ptable { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ptable th, .ptable td { text-align: left; vertical-align: top; white-space: normal; padding: 12px 14px; border-bottom: 1px solid var(--grid); }
  .ptable thead th { color: var(--text); font-size: 16px; font-weight: 650; border-bottom: 1px solid var(--line); }
  .ptable thead th span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 400; }
  .ptable tbody th { color: var(--faint); font-size: 12px; font-weight: 500; width: 130px; }
  .ptable td { color: var(--text); line-height: 1.5; }
  .ptable code, .profiles code { font: 12px var(--mono); color: var(--muted); }
  #formulas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; }
  #formulas:empty { display: none; }
  .formula { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  .formula h3 { margin: 0 0 4px; font-size: 12px; font-weight: 500; color: var(--faint); }
  .formula .expr { margin: 0 0 10px; font: 600 15px var(--mono); color: var(--accent); }
  .formula dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 10px; font-size: 13px; }
  .formula dt { font: 600 13px var(--mono); color: var(--text); text-align: right; }
  .formula dd { margin: 0; color: var(--muted); }
  .formula .ex { margin: 0; font-size: 12px; color: var(--muted); }
  .formula .ex span { color: var(--faint); }
  .formula .ex b { color: var(--text); font: 600 12px var(--mono); }
  .formula .fx { margin: 8px 0 0; font-size: 12px; color: var(--faint); }
  .formula .fx code { font: 600 12px var(--mono); color: var(--text); user-select: all; }
  .formula .fx .codebtn { margin: 0 -6px 0 0; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { all: unset; cursor: pointer; padding: 10px 14px; margin-bottom: -1px; color: var(--muted); font-weight: 550; border-bottom: 2px solid transparent; white-space: nowrap; transition: color 150ms ease-out, border-color 150ms ease-out; }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tabs button small { margin-left: 6px; color: var(--faint); font-weight: 400; font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; }
  .seg button small { margin-left: 5px; color: var(--faint); font-size: 11px; }
  .blurb { margin: 0; color: var(--muted); font-size: 13px; max-width: 90ch; }
  .blurb a { color: var(--accent); text-underline-offset: 3px; }
  h3.sec { margin: 8px 0 0; font-size: 14px; font-weight: 650; }
  h3.sec + .blurb { margin-top: -10px; }
  td .sub { display: block; color: var(--faint); font-size: 11px; line-height: 1.2; }
  td.dim { color: var(--faint); }
  td.hot { color: var(--stale); font-weight: 600; }
  td.ok { color: var(--run); }
  .rbtn { all: unset; cursor: pointer; font-size: 12px; color: var(--muted); padding: 2px 8px; border: 1px solid var(--line); border-radius: 5px; }
  .rbtn:hover { color: var(--text); background: var(--raise); }
  .rbtn:focus-visible { outline: 2px solid var(--accent); }
  details.more { border-top: 1px solid var(--grid); padding-top: 12px; }
  details.more summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.more summary:hover { color: var(--text); }
  details.more[open] summary { margin-bottom: 12px; }
  details.more p { margin: 0 0 8px; color: var(--muted); font-size: 13px; max-width: 90ch; }
  .empty { max-width: 68ch; color: var(--muted); }
  .empty h2 { color: var(--text); font-size: 18px; margin: 8px 0; }
  .empty pre { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; color: var(--text); overflow-x: auto; font: 12px/1.5 var(--mono); }

  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 8px; min-width: 0; }
    #batches, #bossBatches { flex-direction: row; overflow-x: auto; }
    .seg { max-width: 100%; overflow-x: auto; }
    .seg button { flex: none; }
    .item { min-width: 180px; }
    #conn { margin: 0 8px; }
    main { padding: 18px 16px 40px; }
  }
  @media (prefers-reduced-motion: reduce) { .dot.run { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>CLIdle · simulações</h1>
    <nav aria-label="Páginas"><button class="item" id="profilesBtn"><span class="t">Perfis de jogador</span><span class="s">o que cada perfil faz</span></button></nav>
    <p class="side-h">Simulações</p>
    <nav id="batches" aria-label="Simulações"></nav>
    <p class="side-h">Testes de chefe</p>
    <nav id="bossBatches" aria-label="Testes de chefe"></nav>
    <p id="conn">conectando…</p>
  </aside>
  <main id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const CLASSES = ["Warrior", "Mage", "Rogue", "Cleric"];
  const CLASS_PT = { Warrior: "Guerreiro", Mage: "Mago", Rogue: "Ladino", Cleric: "Clérigo" };
  const METRICS = [["floor", "Andar"], ["level", "Nível"], ["deaths", "Mortes"], ["gold", "Saldo"], ["spent", "Gasto"], ["train", "Treino"],
    ["earned", "Ganho"], ["rate", "Ganho/hora"], ["smith", "Ferreiro $"], ["trainGold", "Treino $"], ["potions", "Poções $"], ["shop", "Loja $"], ["bag", "Mochila $"],
    ["heroes", "Heróis"], ["built", "Níveis de prédio"], ["mission", "Mesa de missões"]];
  const BOSS_METRICS = [["pct", "% de vitória"], ["bossLeft", "HP do chefe que sobrou"]];
  const BOSS_PASS = 50;
  const BOSS_HELP = {
    pct: `% de vitória: em quantas das lutas o herói matou o chefe. Passa com ${BOSS_PASS}% ou mais.`,
    bossLeft: "HP do chefe que sobrou: a média de vida que o chefe ainda tinha no fim das lutas (0% quando morre). Mostra o quão longe o herói ficou.",
  };
  const isBoss = () => current?.kind === "boss";
  const CLASS_KEY = { Warrior: "warrior", Mage: "mage", Rogue: "rogue", Cleric: "cleric" };
  const replayCode = (s) => s.replay || `${CLASS_KEY[s.class] || s.class}-${PROFILE_ALIAS[s.label] || s.label}-${s.seed}`;
  const metricsNow = () => isBoss() ? BOSS_METRICS : METRICS;
  const METRIC_HELP = {
    floor: "Andar: o andar mais fundo que o herói já alcançou.",
    level: "Nível: o nível do herói.",
    deaths: "Mortes: total de mortes até ali.",
    gold: "Saldo: o ouro no bolso naquele momento. Cai quando o jogador gasta na cidade.",
    spent: "Gasto: todo o ouro gasto na cidade até ali (ferreiro, treino, loja, mochila e poções).",
    train: "Treino: a soma dos níveis comprados no treino, nos 4 atributos.",
    earned: "Ganho: todo o ouro ganho até ali (saldo + gasto), contando só o que voltou para a cidade.",
    rate: "Ganho/hora: o ouro ganho na última hora de jogo.",
    smith: "Ferreiro $: ouro gasto no ferreiro até ali.",
    trainGold: "Treino $: ouro gasto no treino até ali.",
    potions: "Poções $: ouro gasto em poções compradas ao partir até ali.",
    shop: "Loja $: ouro gasto em itens da loja até ali.",
    bag: "Mochila $: ouro gasto em melhorias da mochila até ali.",
    heroes: "Heróis: quantos heróis a guilda tem (o primeiro mais os contratados).",
    built: "Níveis de prédio: soma dos níveis de todos os prédios (25 = tudo no máximo).",
    mission: "Mesa de missões: nível da Mesa (2 = máximo, 4 heróis ao mesmo tempo).",
  };
  const LIVE_MS = 1000, LIST_MS = 4000, STALE_MS = 15000;
  const css = getComputedStyle(document.documentElement);
  const tok = (n) => css.getPropertyValue(n).trim();
  const COLOR = Object.fromEntries(CLASSES.map((c) => [c, tok("--" + c.toLowerCase())]));
  const colorOf = (c) => COLOR[c] || tok("--text");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const fmt = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
  const compact = new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 });
  const num = (v) => (Math.abs(v) >= 10000 ? compact : fmt).format(v);
  const dur = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return h ? `${h}h ${m}min` : m ? `${m}min ${r}s` : `${r}s`; };
  const ago = (ms) => ms < 3000 ? "agora" : "há " + dur(ms);

  // ---------- data ----------
  const links = async (url) => {
    const html = await (await fetch(url, { cache: "no-store" })).text();
    return [...html.matchAll(/href="([^"?#]+)"/g)].map((m) => decodeURIComponent(m[1])).filter((h) => !h.startsWith("/") && !h.startsWith(".."));
  };
  const getJSON = (url) => fetch(url, { cache: "no-store" }).then((r) => r.ok ? r.json() : null).catch(() => null);

  const batches = new Map(); // id -> {id, files: Map(name -> part)}
  const PROFILES_HASH = "perfis";
  let page = location.hash.slice(1) === PROFILES_HASH ? "profiles" : "sim";
  const [hBatch, hProf, hRun] = decodeURIComponent(location.hash.slice(1)).split("/");
  let selected = page === "sim" ? hBatch || null : null;
  let metric = "floor", eachRun = false, prof = hProf || null, runTab = hRun ? +hRun : "med";
  const setHash = () => history.replaceState(null, "", "#" + [selected, prof, runTab === "med" ? "" : runTab].filter((v) => v != null && v !== "").map(encodeURIComponent).join("/"));
  const hidden = new Set();
  let connErr = false, lastOk = 0;

  const merged = (b) => {
    const parts = [...b.files.values()];
    const series = parts.flatMap((p) => p.series || []);
    const started = Math.min(...parts.map((p) => +new Date(p.started)).filter((v) => v > 0));
    const updated = Math.max(...parts.map((p) => +new Date(p.updated)));
    const kind = parts.find((p) => p.kind)?.kind || "run";
    if (kind === "boss") for (const s of series) s.points = (s.fights || []).map((f) => ({ h: f.floor, ...f }));
    return { id: b.id, kind, title: parts.find((p) => p.title)?.title || b.id, note: parts.find((p) => p.note)?.note || "", formulas: b.formulas || null, series, started, updated };
  };
  const stateOf = (m) => m.series.length && m.series.every((s) => s.done) ? "done" : Date.now() - m.updated < STALE_MS ? "run" : "stale";
  const STATE_TEXT = { run: "rodando", stale: "parada", done: "terminada" };

  const GUILD_TRAITS = {
      start: "Cada herói joga como o Afobado: sempre no atalho mais fundo.",
      gold: "25% do ouro que volta fica guardado para a guilda; o resto o herói gasta em si. A guilda compra o mais barato entre o próximo herói (enquanto a Mesa tem vaga) e o próximo nível de prédio.",
      train: "Como o Afobado; o herói contratado põe os 5 pontos no atributo principal.",
      potions: "Leva 3 (o padrão do jogo)." };
  const PROFILES = {
    rash: { name: "Afobado (rash)", summary: "Quer chegar fundo rápido e não liga de morrer.", traits: {
      start: "Sempre no atalho mais fundo já liberado, mesmo depois de morrer várias vezes seguidas.",
      gold: "Compra sempre a melhoria mais barata: ferreiro, treino ou mochila. Nunca compra na loja.",
      train: "O atributo principal da classe e CON. O ladino só treina DES.",
      potions: "Leva 3 (o padrão do jogo) e guarda ouro para elas." } },
    careful: { name: "Cuidadoso (careful)", summary: "Só avança quando aguenta e não sai sem poções.", traits: {
      start: "Começa no atalho mais raso. Avança um atalho a cada volta viva e recua um depois de 3 mortes seguidas.",
      gold: "Primeiro troca equipamento na loja quando o item é melhor que o atual. Depois compra a melhoria mais barata: ferreiro, treino ou mochila.",
      train: "O atributo principal da classe e CON. O ladino também treina CON.",
      potions: "Leva 5 e sempre guarda ouro para elas." } },
    v18: { name: "Preços da v0.18 (v18)", summary: "Guilda com os preços até a v0.18: prédio 500×(nível+1)², herói 200×heróis.", traits: GUILD_TRAITS },
    A: { name: "Preços A (×4)", summary: "Prédio = base × 4^nível (Mesa 100k, Ferreiro/Treino 50k, Mercado 30k, Alojamento 20k, Boticário 10k); herói 2k × 3^(heróis−1).", traits: GUILD_TRAITS },
    B: { name: "Preços B (×3)", summary: "Prédio = base × 3^nível (mesmas bases, Mesa 125k); herói 2k × 3^(heróis−1).", traits: GUILD_TRAITS },
    idle: { name: "Sem gastos (idle)", summary: "Deixa a auto-expedição ligada e não compra nada para o herói: o ouro todo fica para a guilda.", traits: {
      start: "Sempre no andar 1 (a configuração padrão).",
      gold: "Não gasta: é o máximo de ouro que um herói deixa para a guilda.",
      train: "Nenhum.",
      potions: "Compra 3 ao partir (o padrão do jogo); esse gasto já sai do ganho." } },
  };
  const TRAITS = [["start", "Onde começa"], ["gold", "Como gasta o ouro"], ["train", "Treino"], ["potions", "Poções"]];
  const PROFILE_ALIAS = { now: "v18", old: "rash", smart: "careful", afobado: "rash", cuidadoso: "careful" };
  const profileOf = (l) => PROFILES[PROFILE_ALIAS[l] || l];

  async function loadBatch(id) {
    const b = batches.get(id) || { id, files: new Map() };
    const all = (await links(`data/${encodeURIComponent(id)}/`)).filter((f) => f.endsWith(".json"));
    const names = all.filter((f) => !f.startsWith("_"));
    if (all.includes("_formulas.json") && !b.formulas) b.formulas = await getJSON(`data/${encodeURIComponent(id)}/_formulas.json`);
    const parts = await Promise.all(names.map((f) => getJSON(`data/${encodeURIComponent(id)}/${encodeURIComponent(f)}`)));
    let changed = false;
    names.forEach((f, i) => {
      const p = parts[i];
      if (!p) return;
      const old = b.files.get(f);
      if (!old || old.updated !== p.updated) { b.files.set(f, p); changed = true; }
    });
    if (b.files.size) batches.set(id, b);
    return changed;
  }

  async function refreshList() {
    const dirs = (await links("data/")).filter((d) => d.endsWith("/")).map((d) => d.slice(0, -1));
    await Promise.all(dirs.filter((d) => d !== selected || !batches.has(d)).map(loadBatch));
    for (const id of batches.keys()) if (!dirs.includes(id)) batches.delete(id);
    if (!selected || !batches.has(selected)) {
      const first = [...batches.values()].map(merged).sort((a, b) => (b.started || 0) - (a.started || 0) || (a.id < b.id ? 1 : -1))[0];
      if (first && page === "sim") select(first.id);
      else if (first) selected = first.id;
    }
  }

  async function refreshSelected() {
    if (!selected) return;
    if (await loadBatch(selected)) onData();
  }

  const ok = () => { connErr = false; lastOk = Date.now(); };
  const fail = () => { connErr = true; };
  async function listLoop() { try { await refreshList(); ok(); renderList(); if (!view.built && page === "sim") renderView(); } catch { fail(); renderList(); } setTimeout(listLoop, LIST_MS); }
  async function liveLoop() { if (!document.hidden) { try { await refreshSelected(); ok(); } catch { fail(); } } setTimeout(liveLoop, LIVE_MS); }

  // ---------- aggregation ----------
  const valueAt = (s, t, m) => {
    const pts = s.points, lastP = pts[pts.length - 1];
    if (!lastP || t < pts[0].h) return null;
    if (t > lastP.h + 1e-9) return s.done ? lastP[m] ?? null : null;
    let lo = 0, hi = pts.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (pts[mid].h <= t + 1e-9) lo = mid; else hi = mid - 1; }
    return pts[lo][m] ?? null;
  };
  const median = (vs) => { const a = [...vs].sort((x, y) => x - y), n = a.length; return n % 2 ? a[n >> 1] : (a[n / 2 - 1] + a[n / 2]) / 2; };
  const endH = (s) => s.points.length ? s.points[s.points.length - 1].h : 0;

  let current = null; // merged selected batch
  const labelsOf = (m) => [...new Set(m.series.map((s) => s.label || ""))];
  const seriesOf = (m, label) => m.series.filter((s) => (label === null || (s.label || "") === label) && s.points.length);

  function aggregate(series) {
    const maxH = Math.max(0, ...series.map(endH));
    if (isBoss()) return { maxH, classes: CLASSES.map((c) => series.find((s) => s.class === c)).filter(Boolean).map((s) =>
      ({ cls: s.class, color: colorOf(s.class), runs: [s], live: !s.done, pts: s.points.map((p) => ({ h: p.h, med: p[metric] })) })) };
    const step = Math.max(0.25, maxH / 500);
    const out = [];
    for (const c of CLASSES) {
      const ss = series.filter((s) => s.class === c);
      if (!ss.length) continue;
      const until = Math.max(...ss.map(endH));
      const pts = [];
      for (let i = 0; ; i++) {
        const t = Math.min(until, i * step);
        const vs = ss.map((s) => valueAt(s, t, metric)).filter((v) => v !== null);
        if (vs.length) pts.push({ h: t, med: median(vs) });
        if (t >= until) break;
      }
      const ends = ss.filter((s) => s.done).map(endH).sort((a, b) => a - b);
      const partialAt = ss.length > 1 && ends.length && ends[0] < until - 1e-9 ? ends[0] : null;
      out.push({ cls: c, color: colorOf(c), pts, runs: ss, live: ss.some((s) => !s.done), partialAt });
    }
    return { classes: out, maxH };
  }

  // ---------- charts ----------
  // One chart per policy; all charts share the axes so they can be compared side by side.
  const view = { built: false, charts: [], x: { from: 1, to: 1, t0: 0 }, y: { from: 5, to: 5, t0: 0 },
    reveal: { from: 0, to: 0, t0: 0 }, hover: null, dirty: true };
  const TWEEN = 700;
  const ease = (k) => 1 - Math.pow(1 - k, 3);
  const tweenVal = (tw, now) => { if (reduced) return tw.to; const k = Math.min(1, (now - tw.t0) / TWEEN); return tw.from + (tw.to - tw.from) * ease(k); };
  const retarget = (tw, to, now) => { if (tw.to === to) return; tw.from = tweenVal(tw, now); tw.to = to; tw.t0 = now; };
  const settle = (tw) => { tw.from = tw.to; tw.t0 = 0; };
  const animating = (now) => !reduced && [view.x, view.y, view.reveal].some((tw) => now - tw.t0 < TWEEN);

  function niceMax(v) { if (v <= 5) return 5; const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return ([1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((k) => n <= k)) * p; }
  function niceStep(span, target) { const raw = span / target, p = 10 ** Math.floor(Math.log10(raw)); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

  function updateAgg(fresh) {
    if (!current) return;
    const now = performance.now();
    for (const ch of view.charts) ch.agg = aggregate(isBoss() ? seriesOf(current, null) : shownSeries());
    const all = isBoss() ? view.charts.flatMap((ch) => ch.agg.classes.flatMap((c) => c.runs)) : seriesOf(current, prof);
    const yTop = Math.max(1, ...all.filter((s) => !hidden.has(s.class)).flatMap((s) => s.points.map((p) => p[metric] ?? 0)));
    const maxH = Math.max(0, ...all.map(endH));
    retarget(view.y, isBoss() ? 100 : niceMax(yTop * 1.05), now);
    retarget(view.x, isBoss() ? 100 : Math.max(1, niceMax(maxH)), now);
    retarget(view.reveal, maxH, now);
    if (fresh) [view.x, view.y, view.reveal].forEach(settle);
    view.dirty = true;
  }

  const PAD = { l: 48, r: 92, t: 10, b: 28 };
  const BOSS_EVERY = 10;
  function size(ch) {
    const r = ch.canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    ch.w = r.width; ch.h = r.height;
    ch.canvas.width = Math.round(r.width * dpr); ch.canvas.height = Math.round(r.height * dpr);
    ch.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    view.dirty = true;
  }

  function draw(ch, now) {
    const { ctx, w, h, agg } = ch;
    if (!ctx || !agg || !w) return;
    const xMax = tweenVal(view.x, now), yMax = tweenVal(view.y, now), reveal = tweenVal(view.reveal, now);
    const label = (c, v) => `${CLASS_PT[c.cls] || c.cls} ${num(v)}${isBoss() ? "%" : ""}`;
    ctx.font = `600 12px ${tok("--sans")}`;
    const padR = Math.max(60, 16 + Math.max(0, ...agg.classes.filter((c) => !hidden.has(c.cls) && c.pts.length)
      .map((c) => ctx.measureText(label(c, c.pts[c.pts.length - 1].med)).width)));
    const pw = w - PAD.l - padR, ph = h - PAD.t - PAD.b;
    ch.padR = padR;
    const X = (v) => PAD.l + (v / xMax) * pw, Y = (v) => PAD.t + ph - (v / yMax) * ph;
    ctx.clearRect(0, 0, w, h);
    ctx.font = `11px ${tok("--mono")}`;
    ctx.textBaseline = "middle";

    const ys = niceStep(yMax, 5);
    for (let v = 0; v <= yMax + 1e-9; v += ys) {
      ctx.strokeStyle = tok("--grid"); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(PAD.l, Math.round(Y(v)) + .5); ctx.lineTo(w - padR, Math.round(Y(v)) + .5); ctx.stroke();
      ctx.fillStyle = tok("--faint"); ctx.textAlign = "right"; ctx.fillText(num(v) + (isBoss() ? "%" : ""), PAD.l - 8, Y(v));
    }
    const xs = niceStep(xMax, Math.max(3, Math.floor(pw / 90)));
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    if (isBoss()) for (let v = BOSS_EVERY; v <= xMax; v += BOSS_EVERY) ctx.fillText("andar " + v, X(v), h - PAD.b + 9);
    else for (let v = 0; v <= xMax + 1e-9; v += xs) ctx.fillText(num(v) + "h", X(v), h - PAD.b + 9);
    ctx.textBaseline = "middle";
    if (isBoss() && metric === "pct") {
      const y = Math.round(Y(BOSS_PASS)) + .5;
      ctx.strokeStyle = tok("--accent"); ctx.globalAlpha = .7; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(w - padR, y); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      ctx.fillStyle = tok("--accent"); ctx.textAlign = "left"; ctx.textBaseline = "bottom"; ctx.fillText("passa", PAD.l + 6, y - 3); ctx.textBaseline = "middle";
    }

    const clip = (pts) => { const out = []; for (let i = 0; i < pts.length; i++) { const p = pts[i]; if (p.h <= reveal) { out.push(p); continue; }
      const a = pts[i - 1]; if (a) out.push({ h: reveal, med: a.med + (p.med - a.med) * (reveal - a.h) / (p.h - a.h) }); break; } return out; };
    const ends = [];
    for (const c of agg.classes) {
      if (hidden.has(c.cls)) continue;
      const pts = clip(c.pts);
      if (!pts.length) continue;
      if (eachRun) {
        ctx.strokeStyle = c.color; ctx.globalAlpha = .38; ctx.lineWidth = 1.2;
        for (const s of c.runs) {
          ctx.beginPath(); let first = true;
          for (const p of s.points) { if (p.h > reveal) break; if (p[metric] == null) continue; const x = X(p.h), y = Y(p[metric]); first ? ctx.moveTo(x, y) : ctx.lineTo(x, y); first = false; }
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = c.color; ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.lineCap = "round";
      const cut = c.partialAt ?? Infinity;
      ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(X(p.h), Y(p.med)) : ctx.moveTo(X(p.h), Y(p.med)));
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, Math.min(X(cut), w), h); ctx.clip();
      ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(X(p.h), Y(p.med)) : ctx.moveTo(X(p.h), Y(p.med))); ctx.stroke(); ctx.restore();
      if (cut < Infinity) {
        ctx.save(); ctx.beginPath(); ctx.rect(X(cut), 0, w, h); ctx.clip(); ctx.setLineDash([6, 5]);
        ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(X(p.h), Y(p.med)) : ctx.moveTo(X(p.h), Y(p.med))); ctx.stroke(); ctx.restore();
      }
      if (isBoss()) { ctx.fillStyle = c.color; for (const p of pts) if (p.h % BOSS_EVERY === 0) { ctx.beginPath(); ctx.arc(X(p.h), Y(p.med), 3, 0, Math.PI * 2); ctx.fill(); } }
      const e = pts[pts.length - 1];
      ends.push({ c, x: X(e.h), y: Y(e.med), v: e.med });
    }

    if (!agg.classes.some((c) => c.pts.length)) {
      ctx.fillStyle = tok("--muted"); ctx.textAlign = "center"; ctx.font = `13px ${tok("--sans")}`;
      ctx.fillText("Esta simulação não gravou este dado. As próximas gravam.", PAD.l + pw / 2, PAD.t + ph / 2);
    }
    const pulse = (now % 1600) / 1600;
    for (const e of ends) {
      if (e.c.live) {
        ctx.fillStyle = e.c.color; ctx.globalAlpha = .35 * (1 - pulse);
        ctx.beginPath(); ctx.arc(e.x, e.y, 4 + 8 * pulse, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      }
      ctx.fillStyle = e.c.color; ctx.beginPath(); ctx.arc(e.x, e.y, 3.5, 0, Math.PI * 2); ctx.fill();
    }
    const GAP = 15, bottom = h - PAD.b;
    ends.sort((a, b) => a.y - b.y);
    ends.forEach((e, i) => { e.ly = i ? Math.max(e.y, ends[i - 1].ly + GAP) : e.y; });
    for (let i = ends.length - 1; i >= 0; i--) ends[i].ly = Math.min(ends[i].ly, i === ends.length - 1 ? bottom : ends[i + 1].ly - GAP);
    ctx.textAlign = "left"; ctx.font = `600 12px ${tok("--sans")}`;
    for (const e of ends) { ctx.fillStyle = e.c.color; ctx.fillText(label(e.c, e.v), w - padR + 8, e.ly); }

    if (view.hover !== null) {
      const hx = X(Math.min(view.hover, reveal));
      ctx.strokeStyle = tok("--muted"); ctx.globalAlpha = .5; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(Math.round(hx) + .5, PAD.t); ctx.lineTo(Math.round(hx) + .5, h - PAD.b); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
  }

  function frame(now) {
    const live = view.charts.some((ch) => ch.agg?.classes.some((c) => c.live && !hidden.has(c.cls)));
    if (view.charts.length && (view.dirty || animating(now) || live)) { view.charts.forEach((ch) => draw(ch, now)); view.dirty = false; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function onHover(ch, e) {
    const r = ch.canvas.getBoundingClientRect(), now = performance.now();
    const xMax = tweenVal(view.x, now), reveal = tweenVal(view.reveal, now);
    const t = ((e.clientX - r.left - PAD.l) / (r.width - PAD.l - (ch.padR || 60))) * xMax;
    if (t < 0 || t > reveal + xMax * .02) { leave(); return; }
    view.hover = Math.max(0, Math.min(reveal, t));
    if (isBoss()) view.hover = Math.max(BOSS_EVERY, Math.min(Math.floor(reveal / BOSS_EVERY) * BOSS_EVERY, Math.round(view.hover / BOSS_EVERY) * BOSS_EVERY));
    view.dirty = true;
    for (const c of view.charts) showTip(c, PAD.l + (view.hover / xMax) * (c.w - PAD.l - (c.padR || 60)));
  }
  function showTip(ch, px) {
    const rows = ch.agg.classes.filter((c) => !hidden.has(c.cls)).map((c) => {
      let p = null; for (const q of c.pts) { if (q.h > view.hover + 1e-9) break; p = q; }
      if (!p) return "";
      const vs = c.runs.map((s) => valueAt(s, view.hover, metric)).filter((v) => v !== null);
      const lo = Math.min(...vs), hi = Math.max(...vs);
      const rng = vs.length > 1 && lo !== hi ? `<span class="rng" title="menor–maior entre as runs"> ${num(lo)}–${num(hi)}</span>` : "";
      const ended = !isBoss() && c.runs.filter((s) => s.done && endH(s) <= view.hover + 1e-9).length;
      const note = ended && ended < c.runs.length ? `<div class="r rng"><span>${ended} de ${c.runs.length} runs já terminaram</span></div>` : "";
      return `<div class="r"><span><span class="sw" style="background:${c.color}"></span>${CLASS_PT[c.cls] || c.cls}</span><span class="num">${num(p.med)}${isBoss() ? "%" : ""}${rng}</span></div>${note}`;
    }).join("");
    const tip = ch.tip;
    if (!rows) { tip.classList.remove("on"); return; }
    const lvl = isBoss() && ch.agg.classes[0]?.runs[0].points.find((p) => p.h === view.hover)?.level;
    tip.innerHTML = `<div class="h num">${isBoss() ? `Chefe do andar ${view.hover}${lvl ? ` · herói nível ${lvl}` : ""}` : view.hover.toFixed(1).replace(".", ",") + "h simuladas"}</div>${rows}`;
    tip.classList.add("on");
    const left = px + ch.canvas.offsetLeft, box = tip.parentElement.clientWidth;
    tip.style.left = (left + 16 + tip.offsetWidth > box ? left - 16 - tip.offsetWidth : left + 16) + "px";
  }
  function leave() { view.hover = null; view.dirty = true; view.charts.forEach((ch) => ch.tip.classList.remove("on")); }

  // ---------- views ----------
  function renderList() {
    const all = [...batches.values()].map(merged).sort((a, b) => (b.started || 0) - (a.started || 0) || (a.id < b.id ? 1 : -1));
    const fill = (nav, items) => { const html = items.length ? items.map((m) => { const st = stateOf(m);
      return `<button class="item" data-id="${esc(m.id)}" aria-current="${page === "sim" && m.id === selected}"><span class="t">${esc(m.title)}</span>
        <span class="s"><span class="dot ${st}"></span>${STATE_TEXT[st]} · ${isFinite(m.started) ? new Date(m.started).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : ""}</span></button>`; }).join("")
        : `<p class="side-empty">Nenhum ainda</p>`;
      if (nav.dataset.html === html) return;
      nav.dataset.html = html;
      nav.innerHTML = html;
      nav.querySelectorAll(".item").forEach((b) => b.addEventListener("click", () => select(b.dataset.id))); };
    fill($("#batches"), all.filter((m) => m.kind !== "boss"));
    fill($("#bossBatches"), all.filter((m) => m.kind === "boss"));
    $("#profilesBtn").setAttribute("aria-current", page === "profiles");
    const conn = $("#conn");
    conn.className = connErr ? "err" : "";
    conn.textContent = connErr ? "Não consegui ler data/. Sirva tools/simview com: python3 -m http.server" : "Ao vivo · lê a simulação aberta a cada 1 s";
  }

  function select(id) {
    if (page === "sim" && selected === id && view.built) return;
    if (selected !== id) { prof = null; runTab = "med"; }
    page = "sim"; selected = id; hidden.clear(); view.built = false;
    history.replaceState(null, "", "#" + encodeURIComponent(id));
    renderList();
    refreshSelected().then(() => renderView()).catch(() => renderView());
  }

  const policyName = (l) => "Perfil " + (profileOf(l)?.name || l);

  function showProfiles() {
    page = "profiles"; view.built = false; view.charts = [];
    history.replaceState(null, "", "#" + PROFILES_HASH);
    renderList();
    const cols = Object.values(PROFILES);
    $("#view").innerHTML = `<section class="profiles">
      <h2>Perfis de jogador</h2>
      <p>Cada perfil imita um jeito de jogar entre uma expedição e outra. Na dungeon o herói é o mesmo: o perfil só muda onde ele começa, como o ouro é gasto e quantas poções ele leva.</p>
      <div class="tablewrap"><table class="ptable"><thead><tr><th></th>${cols.map((p) => `<th>${esc(p.name)}<span>${esc(p.summary)}</span></th>`).join("")}</tr></thead>
        <tbody>${TRAITS.map(([k, t]) => `<tr><th scope="row">${t}</th>${cols.map((p) => `<td>${esc(p.traits[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <p><b>Em comum:</b> o herói usa as táticas padrão da classe. Cada perfil roda 3 seeds por classe, até concluir a dungeon 1 ou chegar a 240h simuladas.</p>
      <p>Nos códigos e arquivos os perfis têm nome em inglês: <code>rash</code> (Afobado) e <code>careful</code> (Cuidadoso). Simulações antigas usavam <code>old</code>/<code>afobado</code> e <code>smart</code>/<code>cuidadoso</code>.</p>
    </section>`;
  }
  $("#profilesBtn").addEventListener("click", showProfiles);

  function renderView() {
    if (page === "profiles") { showProfiles(); return; }
    const main = $("#view");
    const b = selected && batches.get(selected);
    view.charts = [];
    if (!b) {
      view.built = false;
      main.innerHTML = `<div class="empty"><h2>Nenhuma simulação ainda</h2>
        <p>Rode uma simulação com <code>SIMVIEW_BATCH</code> e ela aparece aqui sozinha, desenhando ao vivo:</p>
        <pre>SIMVIEW_BATCH=minha-sim SIMVIEW_TITLE="Minha simulação" SIMVIEW_FILE=warrior-careful \\
  SIM_CLASS=0 SIM_PROFILE=careful go test ./internal/game -run TestSimDungeon -timeout 4h</pre>
        <p>Um processo por classe (<code>SIM_CLASS</code> 0 a 3) e perfil (<code>SIM_PROFILE</code>) roda tudo em paralelo; cada um precisa de um <code>SIMVIEW_FILE</code> próprio.</p></div>`;
      return;
    }
    current = merged(b);
    if (!metricsNow().some(([k]) => k === metric)) metric = metricsNow()[0][0];
    if (isBoss()) { renderBossView(main); return; }
    const labels = labelsOf(current).sort((x, y) => profOrder(x) - profOrder(y));
    if (!labels.includes(prof)) prof = labels[0];
    const seeds = runSeeds();
    if (runTab !== "med" && !seeds.includes(runTab)) runTab = "med";
    setHash();
    const pr = profileOf(prof);
    main.innerHTML = `
      <header class="vhead"><h2></h2><div class="status" id="status"></div></header>
      ${labels.length > 1 || pr ? `<nav class="tabs" role="tablist" aria-label="Perfil">${labels.map((l) =>
        `<button role="tab" data-prof="${esc(l)}" aria-selected="${l === prof}">${esc(profileOf(l)?.name.replace(/ \(.*\)/, "") || l || "Runs")}</button>`).join("")}</nav>` : ""}
      ${pr ? `<p class="blurb">${esc(pr.summary)} <a href="#${PROFILES_HASH}" data-profiles>Como cada perfil joga</a></p>` : ""}
      <div class="bar">
        <div class="seg" role="group" aria-label="Run"><button data-run="med" aria-pressed="${runTab === "med"}">Mediana</button>${seeds.map((sd, i) =>
          `<button data-run="${sd}" aria-pressed="${runTab === sd}" title="seed ${sd}">Run ${i + 1}<small class="num">${sd}</small></button>`).join("")}</div>
        <div class="seg" role="group" aria-label="Métrica">${METRICS.map(([k, t]) => `<button data-metric="${k}" aria-pressed="${k === metric}">${t}</button>`).join("")}</div>
      </div>
      <p class="blurb" id="hint"></p>
      <section class="pane">
        <div class="chartbox"><canvas aria-label="Gráfico por classe"></canvas><div class="tip"></div></div>
      </section>
      <h3 class="sec">Resumo</h3>
      <div class="tablewrap"><table id="sumT"><thead></thead><tbody></tbody></table></div>
      <h3 class="sec">Horas paradas em cada chefe</h3>
      <p class="blurb">Do momento em que a classe chega ao andar do chefe até passar dele. Laranja: 24h ou mais. "preso" é quem terminou sem passar.</p>
      <div class="tablewrap"><table id="wallT"><thead></thead><tbody></tbody></table></div>
      <details class="more"><summary>Como ler</summary>
        <p>Mediana: cada linha é a mediana das runs da classe naquele momento; fica tracejada quando parte das runs já terminou (elas param no valor final). Nas tabelas, o cinza embaixo é a faixa da menor à maior run.</p>
        <p>Run 1, 2, 3: uma seed cada, com as 4 classes. O botão Replay copia o código para assistir a run no playground (aba 7 Replay).</p>
        <p>Mediana e runs do mesmo perfil usam a mesma escala. Clique numa classe na tabela para esconder a linha.</p>
      </details>
      <details class="more" id="fwrap"><summary>Fórmulas em vigor nesta simulação</summary><div id="formulas"></div></details>`;
    $(".vhead h2").textContent = current.title;
    main.querySelectorAll("[data-profiles]").forEach((el) => el.addEventListener("click", (e) => { e.preventDefault(); showProfiles(); }));
    main.querySelectorAll("[data-prof]").forEach((el) => el.addEventListener("click", () => { prof = el.dataset.prof; runTab = "med"; renderView(); }));
    main.querySelectorAll("[data-run]").forEach((el) => el.addEventListener("click", () => {
      runTab = el.dataset.run === "med" ? "med" : +el.dataset.run;
      main.querySelectorAll("[data-run]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.run) === String(runTab))); setHash(); refreshChart(false);
    }));
    main.querySelectorAll("[data-metric]").forEach((el) => el.addEventListener("click", () => {
      metric = el.dataset.metric; main.querySelectorAll("[data-metric]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.metric === metric)); refreshChart(true);
    }));
    const canvas = $("canvas", main);
    const ch = { label: prof, canvas, ctx: canvas.getContext("2d"), tip: $(".tip", main), rows: null, w: 0, h: 0, agg: null };
    canvas.addEventListener("mousemove", (e) => onHover(ch, e));
    canvas.addEventListener("mouseleave", leave);
    new ResizeObserver(() => size(ch)).observe(canvas);
    size(ch);
    view.charts = [ch];
    view.built = true;
    refreshChart(true);
  }

  const profOrder = (l) => { const k = PROFILE_ALIAS[l] || l; return k === "careful" ? 0 : k === "rash" ? 1 : 2; };
  const runSeeds = () => [...new Set(seriesOf(current, prof).map((s) => s.seed))].sort((x, y) => x - y);
  const shownSeries = () => seriesOf(current, prof).filter((s) => runTab === "med" || s.seed === runTab);

  function renderBossView(main) {
    main.innerHTML = `
      <header class="vhead"><h2></h2><div class="status" id="status"></div></header>
      <div class="bar"><div class="seg" role="group" aria-label="Métrica">${BOSS_METRICS.map(([k, t]) =>
        `<button data-metric="${k}" aria-pressed="${k === metric}">${t}</button>`).join("")}</div></div>
      <p class="blurb" id="hint"></p>
      <section class="pane">
        <div class="chartbox"><canvas aria-label="Gráfico por classe"></canvas><div class="tip"></div></div>
        <div class="tablewrap"><table><thead><tr><th>Classe</th><th>Andares</th>${Array.from({ length: 10 }, (_, i) => `<th>${(i + 1) * BOSS_EVERY}</th>`).join("")}</tr></thead><tbody></tbody></table></div>
      </section>
      <details class="more"><summary>Como ler</summary><p id="bossNote"></p>
        <p>Na tabela, verde passa e laranja não. Clique num número para copiar o código de uma luta daquele chefe (a primeira derrota) e abrir no playground.</p></details>`;
    $(".vhead h2").textContent = current.title;
    main.querySelectorAll("[data-metric]").forEach((el) => el.addEventListener("click", () => {
      metric = el.dataset.metric; main.querySelectorAll("[data-metric]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.metric === metric)); refreshChart(true);
    }));
    const canvas = $("canvas", main);
    const ch = { label: null, canvas, ctx: canvas.getContext("2d"), tip: $(".tip", main), rows: $("tbody", main), w: 0, h: 0, agg: null };
    canvas.addEventListener("mousemove", (e) => onHover(ch, e));
    canvas.addEventListener("mouseleave", leave);
    new ResizeObserver(() => size(ch)).observe(canvas);
    size(ch);
    view.charts = [ch];
    view.built = true;
    refreshChart(true);
  }

  function renderFormulas() {
    const el = $("#formulas"); if (!el) return;
    const seen = new Set();
    const fs = !isBoss() && current?.formulas && Object.values(current.formulas).flat().filter((f) => !seen.has(f.name) && seen.add(f.name));
    $("#fwrap")?.toggleAttribute("hidden", !fs?.length);
    el.innerHTML = fs ? fs.map((f) => `<section class="formula">
      <h3>${esc(f.name)}</h3><p class="expr">${esc(f.expr)}</p>
      <dl>${f.terms.map(([v, m]) => `<dt>${esc(v)}</dt><dd>${esc(m)}</dd>`).join("")}</dl>
      <p class="ex"><span>Exemplos:</span> ${f.examples.map(([k, v]) => `${esc(k)} <b>${esc(v)}</b>`).join(" · ")}</p>
      ${(f.fx || []).map(([e, x]) => `<p class="fx">Para plotar: <button class="codebtn" title="clique para copiar"><code>${esc(e)}</code></button> · ${esc(x)}</p>`).join("")}
    </section>`).join("") : "";
    el.querySelectorAll(".fx .codebtn").forEach((b) => b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(b.textContent); b.title = "copiado"; } catch {}
    }));
  }

  function refreshChart(fresh) {
    updateAgg(fresh);
    renderStatus();
    renderFormulas();
    if (isBoss()) {
      view.charts.forEach(renderRows);
      $("#hint").textContent = BOSS_HELP[metric];
      $("#bossNote").textContent = current.note || "Cada chefe: 20 lutas. Herói no nível típico de quem chega ao andar, com itens do andar do chefe +10 no ferreiro, 5 poções e táticas padrão.";
      return;
    }
    $("#hint").textContent = METRIC_HELP[metric];
    renderSummary();
    renderWalls();
  }

  function onData() {
    renderList();
    if (page !== "sim") return;
    if (!view.built) { renderView(); return; }
    current = merged(batches.get(selected));
    if (!isBoss() && (!labelsOf(current).includes(prof) || $("[data-run]:last-child")?.dataset.run != String(runSeeds().at(-1) ?? "med"))) { renderView(); return; }
    refreshChart(false);
  }

  function renderStatus() {
    const el = $("#status"); if (!el || !current) return;
    const st = stateOf(current), runs = seriesOf(current, null), done = runs.filter((s) => s.done).length;
    const end = st === "run" ? Date.now() : current.updated;
    const what = isBoss() ? `<span><b class="num">${done}</b> de <b class="num">${runs.length}</b> classes concluídas</span>`
      : `<span><b class="num">${done}</b> de <b class="num">${runs.length}</b> runs concluídas</span>`;
    el.innerHTML = `<span class="dot ${st}"></span><span class="state ${st}">${STATE_TEXT[st][0].toUpperCase() + STATE_TEXT[st].slice(1)}</span>
      ${what}
      ${isFinite(current.started) ? `<span>${st === "run" ? "rodando há" : "rodou por"} <b class="num">${dur(end - current.started)}</b></span>` : ""}
      <span>atualizada <b>${ago(Date.now() - current.updated)}</b></span>`;
  }
  setInterval(() => { renderStatus(); if (connErr === false && lastOk && Date.now() - lastOk > 5000) { connErr = true; renderList(); } }, 1000);

  let toastTimer = 0;
  async function copyCode(code, what, replay) {
    let copied = false;
    try { await Promise.race([navigator.clipboard.writeText(code), new Promise((_, no) => setTimeout(no, 500))]); copied = true; } catch {}
    const t = $("#toast");
    const name = replay ? "Código do replay" : "Código da luta";
    const where = replay ? "aba <b>7 Replay</b> → <b>Código do replay</b>" : "aba <b>6 Config</b> → <b>Código da run</b>";
    t.innerHTML = `<b>${copied ? name + " copiado" : name + " (selecione e copie)"}</b> · ${esc(what)}<br><code>${esc(code)}</code><br>
      No playground: ${where} → enter → cole → enter.`;
    t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("on"), 12000);
  }

  const BOSS_FLOORS = Array.from({ length: 10 }, (_, i) => (i + 1) * BOSS_EVERY);
  const clearedAt = (s) => s.points.find((p) => p.dungeon > 0)?.h ?? null;
  const wallOf = (s, F) => {
    const a = s.points.find((p) => p.floor >= F);
    if (!a) return null;
    const z = F === 100 ? s.points.find((p) => p.dungeon > 0) : s.points.find((p) => p.floor > F);
    return z ? { h: z.h - a.h } : { h: endH(s) - a.h, stuck: s.done };
  };
  const hrs = (h) => h < 10 ? h.toFixed(1).replace(".", ",") + "h" : Math.round(h) + "h";
  const classCell = (c) => `<td><button class="cls" data-cls="${c}" aria-pressed="${!hidden.has(c)}" title="Mostrar ou esconder no gráfico">
    <span class="sw" style="background:${colorOf(c)}"></span>${CLASS_PT[c] || c}</button></td>`;
  const byClass = () => CLASSES.map((c) => [c, shownSeries().filter((s) => s.class === c)]).filter(([, ss]) => ss.length);
  const bindRows = (tb) => {
    tb.querySelectorAll(".cls").forEach((el) => el.addEventListener("click", () => { const k = el.dataset.cls; hidden.has(k) ? hidden.delete(k) : hidden.add(k); refreshChart(false); }));
    tb.querySelectorAll("[data-code]").forEach((el) => el.addEventListener("click", () => copyCode(el.dataset.code, el.dataset.what, true)));
  };

  function renderSummary() {
    const t = $("#sumT"); if (!t) return;
    const med = runTab === "med";
    const cols = [["floor", "Andar"], ["level", "Nível"], ["deaths", "Mortes"], ["train", "Treino"], ["spent", "Gasto"]];
    t.tHead.innerHTML = `<tr><th>Classe</th><th>Concluiu a dungeon</th>${cols.map(([, n]) => `<th>${n}</th>`).join("")}${med ? "" : "<th></th>"}</tr>`;
    const last = (s, m) => s.points[s.points.length - 1][m];
    const cell = (ss, m) => { const vs = ss.map((s) => last(s, m)).filter((v) => v != null);
      if (!vs.length) return `<td class="num dim">—</td>`;
      const lo = Math.min(...vs), hi = Math.max(...vs);
      return `<td class="num">${num(median(vs))}${ss.length > 1 && lo !== hi ? `<span class="sub">${num(lo)}–${num(hi)}</span>` : ""}</td>`; };
    t.tBodies[0].innerHTML = byClass().map(([c, ss]) => {
      const cl = ss.map(clearedAt).filter((v) => v != null);
      const live = ss.some((s) => !s.done);
      const done = med
        ? (cl.length ? `${hrs(median(cl))}<span class="sub">${cl.length} de ${ss.length} runs${cl.length > 1 ? ` · ${hrs(Math.min(...cl))}–${hrs(Math.max(...cl))}` : ""}</span>` : (live ? "rodando" : "não concluiu"))
        : (cl.length ? hrs(cl[0]) : live ? `rodando · ${hrs(endH(ss[0]))}` : `não · parou em ${hrs(endH(ss[0]))}`);
      const s0 = ss[0];
      const replay = med ? "" : `<td><button class="rbtn" data-code="${esc(replayCode(s0))}" data-what="${esc(`${CLASS_PT[c] || c}, ${profileOf(s0.label)?.name || s0.label}, seed ${s0.seed}`)}" title="Copiar o código para assistir no playground">Replay</button></td>`;
      return `<tr class="${hidden.has(c) ? "off" : ""}">${classCell(c)}<td class="num ${cl.length ? "" : "dim"}">${done}</td>${cols.map(([m]) => cell(ss, m)).join("")}${replay}</tr>`;
    }).join("");
    bindRows(t.tBodies[0]);
  }

  function renderWalls() {
    const t = $("#wallT"); if (!t) return;
    t.tHead.innerHTML = `<tr><th>Classe</th>${BOSS_FLOORS.map((F) => `<th>${F}</th>`).join("")}</tr>`;
    t.tBodies[0].innerHTML = byClass().map(([c, ss]) => `<tr class="${hidden.has(c) ? "off" : ""}">${classCell(c)}${BOSS_FLOORS.map((F) => {
      const ws = ss.map((s) => wallOf(s, F)).filter(Boolean);
      if (!ws.length) return `<td class="num dim">·</td>`;
      const passed = ws.filter((w) => !w.stuck && w.h != null), stuck = ws.filter((w) => w.stuck);
      const tip = ss.map((s, i) => { const w = wallOf(s, F); return `run ${i + 1}: ${!w ? "não chegou" : w.stuck ? "preso " + hrs(w.h) : hrs(w.h)}`; }).join(" · ");
      if (!passed.length) return `<td class="num hot" title="${tip}">${stuck.length ? "preso" : "…"}<span class="sub">${stuck.length ? hrs(Math.max(...stuck.map((w) => w.h))) : ""}</span></td>`;
      const v = median(passed.map((w) => w.h));
      return `<td class="num ${v >= 24 ? "hot" : v < 1 ? "dim" : ""}" title="${tip}">${hrs(v)}${stuck.length ? `<span class="sub">${stuck.length} preso</span>` : ""}</td>`;
    }).join("")}</tr>`).join("");
    bindRows(t.tBodies[0]);
  }

  function renderRows(ch) {
    if (!ch.agg) return;
    if (isBoss()) {
      ch.rows.innerHTML = ch.agg.classes.map((c) => {
        const pts = c.runs[0].points;
        const cells = Array.from({ length: 10 }, (_, i) => { const p = pts.find((q) => q.h === (i + 1) * BOSS_EVERY);
          if (!p) return `<td class="num">${c.live && pts.length === i ? `<span class="dot run" style="display:inline-block"></span>` : ""}</td>`;
          const v = p[metric], ok = p.pct >= BOSS_PASS;
          const tip = `${p.wins} de ${p.fights} lutas · herói nível ${p.level} · chefe ficou com ${p.bossLeft}% do HP`;
          const inner = p.code ? `<button class="codebtn" data-code="${esc(p.code)}" data-what="${esc(`${CLASS_PT[c.cls] || c.cls}, chefe do andar ${p.floor}, seed ${p.seed}, ${p.won ? "venceu" : "perdeu"}`)}"
            title="${tip} · clique para copiar o código da luta">${v}%</button>` : `${v}%`;
          return `<td class="num ${ok ? "pass" : "fail"}" title="${tip}">${inner}</td>`; }).join("");
        return `<tr class="${hidden.has(c.cls) ? "off" : ""}"><td><button class="cls" data-cls="${c.cls}" aria-pressed="${!hidden.has(c.cls)}" title="Mostrar ou esconder no gráfico">
          <span class="sw" style="background:${c.color}"></span>${CLASS_PT[c.cls] || c.cls}</button></td><td class="num">${pts.length}/10</td>${cells}</tr>`;
      }).join("");
      ch.rows.querySelectorAll(".cls").forEach((el) => el.addEventListener("click", () => {
        const k = el.dataset.cls; hidden.has(k) ? hidden.delete(k) : hidden.add(k); refreshChart(false);
      }));
      ch.rows.querySelectorAll(".codebtn").forEach((el) => el.addEventListener("click", () => copyCode(el.dataset.code, el.dataset.what)));
    }
  }

  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshSelected(); });
  renderView();
  listLoop();
  liveLoop();
})();
</script>
</body>
</html>
