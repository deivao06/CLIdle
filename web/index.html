<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CLIdle</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; overflow: hidden; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  #term { width: 100%; height: 100%; }
  .xterm-viewport { overflow-y: hidden !important; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
         font: 16px Menlo, "DejaVu Sans Mono", Consolas, monospace; text-align: center; white-space: pre-wrap; }
  #msg:empty { display: none; }
</style>
</head>
<body>
<div id="term"></div>
<div id="msg">Loading…</div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="wasm_exec.js"></script>
<script>
(() => {
  const minCols = 45;
  const msg = document.getElementById("msg");
  const fontSize = () => Math.max(8, Math.min(16, Math.floor(window.innerWidth / (minCols * 0.6))));
  const term = new Terminal({
    fontFamily: 'Menlo, "DejaVu Sans Mono", Consolas, monospace',
    fontSize: fontSize(),
    cursorBlink: false,
    scrollback: 0,
    theme: { background: "#000000" },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));
  fit.fit();

  window.clidle = {
    cols: term.cols,
    rows: term.rows,
    write: (bytes) => term.write(bytes),
    fail: (text) => { msg.textContent = text; },
    exit: () => { term.reset(); msg.textContent = "Saved. Reload the page to play again."; },
  };

  let pending;
  window.addEventListener("resize", () => {
    clearTimeout(pending);
    pending = setTimeout(() => {
      term.options.fontSize = fontSize();
      fit.fit();
      if (window.clidle.resize) window.clidle.resize(term.cols, term.rows);
    }, 100);
  });

  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("clidle.wasm"), go.importObject)
    .then((r) => {
      msg.textContent = "";
      term.onData((d) => window.clidle.input && window.clidle.input(d));
      term.focus();
      return go.run(r.instance);
    })
    .catch((e) => { msg.textContent = String(e); });
})();
</script>
</body>
</html>
