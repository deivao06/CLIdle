<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLIdle">
<title>CLIdle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  #term { width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .xterm-viewport { overflow-y: hidden !important; }
  .xterm-helper-textarea { position: fixed !important; top: 0 !important; left: 0 !important; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
         font: 16px Menlo, "DejaVu Sans Mono", Consolas, monospace; text-align: center; white-space: pre-wrap; }
  #msg:empty { display: none; }
</style>
</head>
<body>
<div id="term"></div>
<div id="msg">Loading…</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="wasm_exec.js"></script>
<script>
(() => {
  const minCols = 45;
  const touch = matchMedia("(pointer: coarse)").matches || location.search.includes("touch");
  const msg = document.getElementById("msg");
  const fontSize = () => Math.max(8, Math.min(16, Math.floor(window.innerWidth / (minCols * 0.6))));
  const term = new Terminal({
    fontFamily: 'Menlo, "DejaVu Sans Mono", Consolas, monospace',
    fontSize: fontSize(),
    cursorBlink: false,
    scrollback: 0,
    lineHeight: touch ? 1.2 : 1,
    theme: { background: "#000000" },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));
  fit.fit();

  if (touch) term.textarea.setAttribute("inputmode", "none");

  window.addEventListener("scroll", () => { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); });

  const el = document.getElementById("term");
  let lastY = null, moved = 0;
  el.addEventListener("touchstart", (e) => { lastY = e.touches[0].clientY; moved = 0; }, { capture: true, passive: true });
  el.addEventListener("touchmove", (e) => {
    if (lastY === null || !window.clidle.input) return;
    const y = e.touches[0].clientY;
    moved += lastY - y;
    lastY = y;
    const row = el.clientHeight / term.rows;
    while (Math.abs(moved) >= row) {
      window.clidle.input(moved > 0 ? "\x1b[B" : "\x1b[A");
      moved -= Math.sign(moved) * row;
    }
    e.preventDefault();
  }, { capture: true, passive: false });

  window.clidle = {
    get cols() { return term.cols; },
    get rows() { return term.rows; },
    write: (bytes) => term.write(bytes),
    fail: (text) => { msg.textContent = text; },
    exit: () => { term.reset(); msg.textContent = "Saved. Reload the page to play again."; },
    reload: async () => {
      term.reset();
      msg.textContent = "Updating...";
      try {
        const reg = await navigator.serviceWorker?.getRegistration();
        if (reg) {
          const installed = reg.update().then(() => {
            const w = reg.installing;
            if (w) return new Promise((done) => w.addEventListener("statechange", () => w.state === "activated" || w.state === "redundant" ? done() : 0));
          });
          await Promise.race([installed, new Promise((done) => setTimeout(done, 10000))]);
        }
      } catch {}
      location.reload();
    },
  };

  term.onResize(({ cols, rows }) => window.clidle.resize && window.clidle.resize(cols, rows));
  let pending;
  const refit = () => {
    clearTimeout(pending);
    pending = setTimeout(() => {
      term.options.fontSize = fontSize();
      fit.fit();
    }, 100);
  };
  window.addEventListener("resize", refit);
  new ResizeObserver(refit).observe(el);

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("clidle.wasm"), go.importObject)
    .then((r) => {
      msg.textContent = "";
      term.onData((d) => window.clidle.input && window.clidle.input(d));
      term.focus();
      return go.run(r.instance);
    })
    .catch((e) => { msg.textContent = String(e); });
})();
</script>
</body>
</html>
